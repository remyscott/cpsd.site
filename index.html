<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cpsd.site</title>
<meta name="robots" content="noindex">
<noscript><meta http-equiv="refresh" content="0; url=https://www.cpsd.us/"></noscript>
<style>
  html, body { height: 100%; margin: 0; background: #0b0d12; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
<script>
(function () {
  var GAME = 'https://empires.cpsd.site';
  var HOME = 'https://www.cpsd.us';
  var isPath = function (s) { return typeof s === 'string' && /^\/(?!\/)/.test(s); };

  // Inside someone else's frame this page never nests itself: it opens the game directly instead.
  if (window.top !== window.self) {
    var p0 = new URLSearchParams(location.search).get('p');
    location.replace(GAME + (isPath(p0) ? p0 : '/play') + location.hash);
    return;
  }

  // The game's server sends a direct visitor here with the game's path in ?p (the fragment rides along by itself).
  // Without one, a reload returns to the place the game last reported. Everyone else is sent to cpsd.us.
  var p = new URLSearchParams(location.search).get('p');
  var want = isPath(p) ? p + location.hash : null;
  if (!want) { try { want = sessionStorage.getItem('empires'); } catch (e) {} }
  if (!isPath(want)) {
    location.replace(HOME + location.pathname + location.search + location.hash);
    return;
  }
  try { sessionStorage.setItem('empires', want); } catch (e) {}
  history.replaceState(null, '', '/');

  addEventListener('message', function (e) {
    if (e.origin !== GAME || !e.data || e.data.empires !== 'location' || !isPath(e.data.url)) return;
    try { sessionStorage.setItem('empires', e.data.url); } catch (err) {}
  });

  addEventListener('DOMContentLoaded', function () {
    var f = document.createElement('iframe');
    f.src = GAME + want;
    f.title = 'EMPIRES';
    f.allow = 'fullscreen; clipboard-write; autoplay';
    f.allowFullscreen = true;
    f.onload = function () { try { f.contentWindow.focus(); } catch (e) {} };
    document.body.appendChild(f);
  });
})();
</script>
</head>
<body></body>
</html>
